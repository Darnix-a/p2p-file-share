name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive_ext: tar.gz
          - goos: linux
            goarch: arm64
            archive_ext: tar.gz
          - goos: darwin
            goarch: amd64
            archive_ext: tar.gz
          - goos: darwin
            goarch: arm64
            archive_ext: tar.gz
          - goos: windows
            goarch: amd64
            archive_ext: zip
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Build Binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            EXT=".exe"
          fi
          BIN_NAME="p2p-drop-${{ matrix.goos }}-${{ matrix.goarch }}${EXT}"
          go build -ldflags="-s -w" -o "dist/${BIN_NAME}" ./cmd/p2p-drop

      - name: Package Archive
        run: |
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            sudo apt-get update && sudo apt-get install -y zip
            zip -q "p2p-drop-${{ matrix.goos }}-${{ matrix.goarch }}.zip" "p2p-drop-${{ matrix.goos }}-${{ matrix.goarch }}.exe"
          else
            tar -czf "p2p-drop-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz" "p2p-drop-${{ matrix.goos }}-${{ matrix.goarch }}"
          fi

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          fail_on_unmatched_files: false
